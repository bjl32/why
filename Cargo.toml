[package]
name = "why"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "A Linux program troubleshooter: it explains why a program does not work"
license = "MIT"
readme = "README.md"
keywords = ["linux", "elf", "troubleshooting", "diagnostics", "cli"]
categories = ["command-line-utilities"]

[dependencies]

[lib]
name = "why"
path = "src/lib.rs"

[[bin]]
name = "why"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
